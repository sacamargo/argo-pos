<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Argo POS preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="140" fill="#2563eb" opacity="0.18"/>
  <circle cx="160" cy="560" r="120" fill="#22c55e" opacity="0.12"/>

  <text x="64" y="78" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="42" font-weight="700">Argo POS</text>
  <text x="64" y="118" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20">Local-first · Offline-first · Touch-first</text>

  <g filter="url(#shadow)" transform="translate(64,160)">
    <rect width="1072" height="420" rx="20" fill="#020617" stroke="#334155"/>
    <!-- sidebar -->
    <rect x="16" y="16" width="180" height="388" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <rect x="32" y="40" width="148" height="36" rx="10" fill="#2563eb"/>
    <text x="56" y="63" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">POS</text>
    <text x="48" y="112" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Dashboard</text>
    <text x="48" y="148" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Ventas</text>
    <text x="48" y="184" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Tutorial</text>
    <text x="48" y="220" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Catálogo</text>

    <!-- categories -->
    <rect x="212" y="16" width="120" height="388" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <rect x="228" y="40" width="88" height="32" rx="8" fill="#2563eb"/>
    <text x="248" y="61" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Todos</text>
    <rect x="228" y="84" width="88" height="32" rx="8" fill="#1e293b"/>
    <text x="242" y="105" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Granizados</text>
    <rect x="228" y="128" width="88" height="32" rx="8" fill="#1e293b"/>
    <text x="248" y="149" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Extras</text>

    <!-- products -->
    <rect x="348" y="16" width="420" height="388" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <g>
      <rect x="368" y="40" width="170" height="150" rx="14" fill="#111827" stroke="#334155"/>
      <rect x="368" y="40" width="170" height="78" rx="14" fill="#1e293b"/>
      <text x="384" y="145" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Granizado limón</text>
      <text x="384" y="168" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">$8.000</text>
    </g>
    <g>
      <rect x="556" y="40" width="170" height="150" rx="14" fill="#111827" stroke="#334155"/>
      <rect x="556" y="40" width="170" height="78" rx="14" fill="#1e293b"/>
      <text x="572" y="145" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Extra sirope</text>
      <text x="572" y="168" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">$2.000</text>
    </g>
    <g>
      <rect x="368" y="210" width="170" height="150" rx="14" fill="#111827" stroke="#334155"/>
      <rect x="368" y="210" width="170" height="78" rx="14" fill="#1e293b"/>
      <text x="384" y="315" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Granizado mora</text>
      <text x="384" y="338" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">$9.000</text>
    </g>

    <!-- cart -->
    <rect x="784" y="16" width="272" height="388" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="808" y="54" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">Carrito</text>
    <text x="808" y="96" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Granizado limón ×2</text>
    <text x="808" y="120" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">$16.000</text>
    <text x="808" y="170" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Descuento</text>
    <rect x="808" y="180" width="120" height="34" rx="8" fill="#111827" stroke="#334155"/>
    <text x="808" y="250" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Total $16.000</text>
    <rect x="808" y="280" width="224" height="52" rx="14" fill="#16a34a"/>
    <text x="880" y="312" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Cobrar</text>
    <text x="808" y="370" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Venta &lt; 10 s · sin internet</text>
  </g>

  <text x="64" y="612" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">SQLite local · Tauri · Tutorial in-app con pasos visuales</text>
</svg>
